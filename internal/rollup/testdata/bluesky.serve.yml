          SELECT bucket, lang, posts,
                 dense_rank() OVER (ORDER BY lang_total DESC, lang) AS lang_rank
          FROM (
            SELECT bucket, lang, posts, sum(posts) OVER (PARTITION BY lang) AS lang_total
            FROM pg.posts_by_lang_1h
