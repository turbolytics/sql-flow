# local.table.yml with the response cache on for one dataset, and the reason
# it is off for the other.
#
#   SQLFLOW_SERVE_CLIENT_ID=local-dev sqlflow serve dev/config/serve/local.cached.yml
#   curl 'http://localhost:8080/v1/datasets/event_totals?client_id=local-dev'
#
# Ask twice: the first answer says "cache":"miss", the second "cache":"hit" and
# how old it is, for fifteen seconds.
commands:
  - name: pin the session timezone
    sql: SET TimeZone='UTC';
  - name: create the events table
    sql: |
      CREATE TABLE events AS
      SELECT * FROM (VALUES
        (TIMESTAMPTZ '2026-09-10 00:05:00+00', 'New York'),
        (TIMESTAMPTZ '2026-09-10 00:40:00+00', 'New York'),
        (TIMESTAMPTZ '2026-09-10 01:15:00+00', 'Baltimore'),
        (TIMESTAMPTZ '2026-09-11 09:30:00+00', 'Baltimore'),
        (TIMESTAMPTZ '2026-09-11 09:45:00+00', 'New York')
      ) AS t(event_at, city);

serve:
  name: local-cached

  http:
    addr: "0.0.0.0:{{ SQLFLOW_SERVE_PORT|default('8080') }}"

  clients:
    - name: local
      id: "{{ SQLFLOW_SERVE_CLIENT_ID }}"

  limits:
    max_rows: 1000
    timeout_seconds: 5

  datasets:
    - name: event_totals
      description: Every event, counted. One row.
      # The opt-in. An answer is served for this long after the query that
      # produced it started, and nothing is cached without this block.
      cache: {ttl_seconds: 15}
      sql: SELECT count(*) AS events, min(event_at) AS first_event_at FROM events

    # Not cached, on purpose. A cached range is rounded up to the grain's
    # bucket, which returns the same rows only when the SQL compares since and
    # until with values already on a bucket boundary. This SQL filters the raw
    # event_at, so rounding since from 00:30 to 01:00 would drop the 00:40
    # event. A dataset that reads a rollup table's bucket column may opt in;
    # `sqlflow rollup serve` generates those.
    - name: city_events
      description: Events per bucket per city. Without grain, the finest grain that serves the range.
      params:
        - {name: city, type: string}
        - {name: since, type: timestamp}
        - {name: until, type: timestamp}
      range: {since: since, until: until, default: 1d}
      grains:
        1h:
          max_range: 2d
          sql: |
            SELECT time_bucket(INTERVAL '1 hour', event_at) AS bucket, city, count(*) AS events
            FROM events
            WHERE city = coalesce($city, city)
              AND event_at >= $since
              AND event_at <  $until
            GROUP BY ALL
            ORDER BY bucket, city
        1d:
          max_range: 30d
          sql: |
            SELECT time_bucket(INTERVAL '1 day', event_at) AS bucket, city, count(*) AS events
            FROM events
            WHERE city = coalesce($city, city)
              AND event_at >= $since
              AND event_at <  $until
            GROUP BY ALL
            ORDER BY bucket, city
