# Serves a table this file creates, so it runs with nothing installed.
#
#   SQLFLOW_SERVE_CLIENT_ID=local-dev sqlflow serve dev/config/serve/local.table.yml
#   curl 'http://localhost:8080/v1/datasets/city_events?client_id=local-dev&city=Baltimore&since=2026-09-10T00:00:00Z&until=2026-09-12T00:00:00Z'
#
# The events are fixed in September 2026, so give since and until: the
# default range ends now.
commands:
  - name: pin the session timezone
    sql: SET TimeZone='UTC';
  - name: create the events table
    sql: |
      CREATE TABLE events AS
      SELECT * FROM (VALUES
        (TIMESTAMPTZ '2026-09-10 00:05:00+00', 'New York'),
        (TIMESTAMPTZ '2026-09-10 00:40:00+00', 'New York'),
        (TIMESTAMPTZ '2026-09-10 01:15:00+00', 'Baltimore'),
        (TIMESTAMPTZ '2026-09-11 09:30:00+00', 'Baltimore'),
        (TIMESTAMPTZ '2026-09-11 09:45:00+00', 'New York')
      ) AS t(event_at, city);

serve:
  name: local-table

  http:
    addr: "0.0.0.0:{{ SQLFLOW_SERVE_PORT|default('8080') }}"

  clients:
    - name: local
      id: "{{ SQLFLOW_SERVE_CLIENT_ID }}"

  limits:
    max_rows: 1000
    timeout_seconds: 5

  datasets:
    - name: event_totals
      description: Every event, counted. One row.
      sql: SELECT count(*) AS events, min(event_at) AS first_event_at FROM events

    - name: city_events
      description: Events per bucket per city. Without grain, the finest grain that serves the range.
      params:
        - {name: city, type: string}
        - {name: since, type: timestamp}
        - {name: until, type: timestamp}
      range: {since: since, until: until, default: 1d}
      grains:
        1h:
          max_range: 2d
          sql: |
            SELECT time_bucket(INTERVAL '1 hour', event_at) AS bucket, city, count(*) AS events
            FROM events
            WHERE city = coalesce($city, city)
              AND event_at >= $since
              AND event_at <  $until
            GROUP BY ALL
            ORDER BY bucket, city
        1d:
          max_range: 30d
          sql: |
            SELECT time_bucket(INTERVAL '1 day', event_at) AS bucket, city, count(*) AS events
            FROM events
            WHERE city = coalesce($city, city)
              AND event_at >= $since
              AND event_at <  $until
            GROUP BY ALL
            ORDER BY bucket, city
