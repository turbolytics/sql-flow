pipeline:
  name: kafka-postgres-sink-example
  description: "Inserts a kafka stream into a postgres table"
  batch_size: {{ SQLFLOW_BATCH_SIZE|default(1) }}

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('input-kafka-postgres-sink') }}

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT
        CAST(timestamp as TIMESTAMP) as timestamp,
        -- user_action.user_id is text, and the sink does not cast. A
        -- BIGINT into a text column fails the batch with exit 10.
        CAST(user_id AS TEXT) AS user_id,
        action,
        browser
      FROM batch

  # Every consumed row is inserted; a redelivery after a crash inserts it
  # again, so append is at-least-once for the reader.
  #
  # A batch is one transaction. One value Postgres refuses, a browser string
  # carrying a NUL byte say, fails the whole batch with exit 10, and Kafka
  # replays it on restart. Clean raw event strings in the handler's SQL.
  sink:
    type: postgres
    postgres:
      dsn: "{{ SQLFLOW_POSTGRES_USERS_URI|default('postgresql://postgres:postgres@localhost:5432/testdb') }}"
      table: user_action
      mode: append
