pipeline:
  batch_size: {{ SQLFLOW_BATCH_SIZE|default(5000) }}

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('topic-local-parquet-sink') }}

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT COUNT(*) as num_records FROM batch

  sink:
    type: sqlcommand
    sqlcommand:
      substitutions:
        - var: $sqlflow_uuid
          type: uuid4
      sql: |
        COPY sqlflow_sink_batch
          TO '{{ SQLFLOW_SINK_BASE_PATH|default('/tmp/sqlflow/test/local.parquet.sink.yml/testing') }}/$sqlflow_uuid.parquet'
        (FORMAT 'parquet');
