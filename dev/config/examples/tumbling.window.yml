tables:
  sql:
    - name: agg_cities_count
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the engine deletes every closed window, so an index
      # grows memory without bound. Each batch appends its own counts and
      # emit_sql sums them. See #268.
      sql: |
        CREATE TABLE agg_cities_count (
          bucket TIMESTAMPTZ,
          city VARCHAR,
          count INT
        );

      # The engine closes the window. It keeps a watermark in event time: the
      # newest bucket the data has reached, less the grace. A bucket closes
      # once its end is at or before the watermark, so the result is the same
      # whether the data arrives live or as a replay. The watermark never moves
      # backwards, and it survives a restart when the pipeline has a state
      # path.
      #
      # The trade: the newest bucket waits for a later one. idle_close_seconds
      # is the bound on that wait: after that long with nothing arriving,
      # every open bucket closes.
      window:
        time_column: bucket
        size_seconds: 3600
        # The watermark is the newest bucket start, so a grace shorter than a
        # bucket rounds up to one: an hourly bucket closes when the next hour's
        # first row arrives. Zero says that plainly.
        grace_seconds: 0
        idle_close_seconds: 60
        # The sink is a topic, which appends. drop keeps each bucket to one
        # message; reemit would publish a correction the consumer has to
        # apply itself.
        late_rows: drop
        # emit_sql shapes the closed rows. closed is every row of every bucket
        # that just closed. GROUP BY ALL groups by the output columns, which
        # is what the renamed bucket needs.
        emit_sql: |
          SELECT
            strftime(bucket, '%Y-%m-%dT%H:%M:%S') AS bucket,
            city,
            sum(count)::INT AS count
          FROM closed
          GROUP BY ALL
          ORDER BY city
        sink:
          type: kafka
          kafka:
            brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
            topic: {{ SQLFLOW_OUTPUT_TOPIC|default('output-tumbling-window-1') }}

pipeline:
  batch_size: 1000

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - "{{ SQLFLOW_TOPIC|default('tumbling-window') }}"

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      INSERT INTO agg_cities_count
      BY NAME
      SELECT
        date_trunc('hour', CAST(timestamp as TIMESTAMPTZ)) as bucket,
        properties.city as city,
        count(*) as count
      FROM batch
      GROUP BY
        bucket, city

  sink:
    type: noop
