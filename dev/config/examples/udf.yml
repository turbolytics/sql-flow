# This config does not run. It is kept as the fixture that proves a `udfs:`
# block is rejected rather than silently ignored, and the import path names a
# module that pre-v1 provided and nothing does now. Define the function in
# DuckDB instead: a macro, an extension, or an ATTACHed database.
udfs:
  - function_name: parse_domain
    import_path: sqlflow.udf.url.parse_domain

pipeline:
  batch_size: 1000

  source:
    type: kafka
    kafka:
      brokers: [{{ kafka_brokers|default('localhost:9092') }}]
      group_id: test
      auto_offset_reset: earliest
      topics:
        - "input-udf"

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT
        parse_domain(url) as domain
      FROM batch

  sink:
    type: kafka
    kafka:
      brokers: [{{ kafka_brokers|default('localhost:9092') }}]
      topic: output-udf
