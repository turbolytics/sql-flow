# Usage metering, step one: an HTTP endpoint that puts each metered event in
# Kafka and answers only once it is there. The count pipeline, count.yml,
# reads the topic.
#
# A request body is a batch: {"events": [{"id", "customer", "meter",
# "quantity", "ts_ms"}, ...]}. The handler unnests it to one row per event
# and drops events with no id or customer, because the count depends on both.
pipeline:
  name: metering-ingest
  # A batch flushes when it fills or after the interval. With ack after_flush
  # below, a request waits for one of those, so the interval is the ceiling
  # on how long a sender waits for its 200: measured p50 1.00s, p99 1.04s for
  # a lone sender at 1s.
  batch_size: 500
  flush_interval_seconds: 1

  source:
    type: webhook
    webhook:
      addr: "0.0.0.0:{{ PORT|default('8001') }}"
      # Answer after the batch holding the body has flushed to Kafka and its
      # position is committed. A 200 then means the event is in the log; a
      # flush that fails answers 503 and the sender retries. The default,
      # on_receive, answers as the body is queued, and a crash before the
      # flush loses an event the sender was told it had delivered.
      ack: after_flush

  handler:
    type: handlers.InferredMemBatch
    sql: |
      SELECT e.id, e.customer, e.meter, e.quantity, e.ts_ms
      FROM (SELECT unnest(events) AS e FROM batch)
      WHERE e.id IS NOT NULL AND e.customer IS NOT NULL

  sink:
    type: kafka
    kafka:
      brokers: ["{{ SQLFLOW_KAFKA_BROKERS|default('kafka:9092') }}"]
      topic: usage.events
      # Key every record by the customer, so a retried event lands on the
      # partition its original went to, where the count window sees both and
      # counts the id once. Unkeyed, the partitioner spreads a retry and its
      # original across partitions and each is counted.
      key: customer
