# Counts the post "kind" in one-minute buckets and publishes each closed
# window to Kafka.
tables:
  sql:
    - name: agg_post_kind_count_1_minute
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the engine deletes every closed window, so an index
      # grows memory without bound. Each batch appends its own counts and
      # emit_sql sums them. See #268.
      sql: |
        CREATE TABLE agg_post_kind_count_1_minute (
          bucket TIMESTAMPTZ,
          kind VARCHAR,
          count INT
        );

      # The engine closes the window against a watermark in event time: the
      # newest bucket the data has reached, less the grace. A bucket closes
      # once its end is at or before the watermark, so the result is the same
      # whether the data arrives live or as a replay. After idle_close_seconds
      # with nothing arriving, every open bucket closes.
      #
      # No lateness, because the sink is a topic, which appends: a post for a
      # bucket that already closed is refused before the handler and counted
      # in window_late_rows_total, so each bucket reaches the topic once.
      window:
        time_column: bucket
        size_seconds: 60
        grace_seconds: 60
        idle_close_seconds: 60
        emit_sql: |
          SELECT
            strftime(bucket, '%Y-%m-%dT%H:%M:%S') AS iso_string,
            kind,
            sum(count)::INT AS count
          FROM closed
          GROUP BY ALL
        sink:
          type: kafka
          kafka:
            brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
            topic: output-bluesky-post-kind-count-1-minute

pipeline:
  batch_size: 1
  source:
    type: websocket
    websocket:
      uri: 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post'
      # The post's own time: time_us, microseconds since the epoch.
      event_time:
        path: time_us
        format: unix_us

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      INSERT INTO agg_post_kind_count_1_minute
      SELECT
        time_bucket(INTERVAL '1 minute', event_time) AS bucket,
        kind,
        count(*) as count
      FROM batch
      GROUP BY
        bucket, kind

  sink:
    type: noop
