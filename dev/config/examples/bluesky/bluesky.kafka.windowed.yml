# Counts the post "kind" using 5 minute buckets (aggregation).
# Publishes the 5-minute windows to kafka.
tables:
  sql:
    # Create the table to store the count of each post kind in 5 minute buckets
    # This table is available for reference within the pipeline.
    - name: agg_post_kind_count_1_minute
      sql: |
        CREATE TABLE agg_post_kind_count_1_minute (
          bucket TIMESTAMPTZ,
          kind VARCHAR,
          count INT 
        );
        CREATE UNIQUE INDEX five_minute_post_kind_count_idx ON agg_post_kind_count_1_minute (bucket, kind);

      manager:
        # The tumbling window manager will identify records with "closed" windows i.e. windows < now - duration_seconds
          # A window closes against the stream's own clock, not wall clock.
          # max(bucket) is the newest window the data has reached, so a window
          # closes only once the stream has moved past it. That keeps the
          # result identical whether the data arrives live or as a replay.
          #
          # With now() here instead, a pipeline running behind real time by
          # more than the grace period closes a window whose rows are still
          # arriving and publishes it in parts, once per poll. Downstream those
          # parts are indistinguishable from an at-least-once duplicate.
          #
          # The trade: the newest window waits for a later one, so a stream
          # that stops leaves its final window unpublished.
          #
          # The second branch is the idleness bound. A stream that goes quiet
          # never moves its own clock, so the first branch alone would hold
          # the newest window open until data a full grace newer arrived: a
          # surge that stops leaves its last bucket unpublished forever.
          # sqlflow_progress is the engine's one-row liveness table and
          # last_arrival is when the newest batch was written, so after a
          # grace of silence every open window closes. It is TIMESTAMPTZ, so
          # the comparison holds whatever timezone the host runs in.
        tumbling_window:
          collect_closed_windows_sql: |
            SELECT 
              strftime(bucket, '%Y-%m-%dT%H:%M:%S') AS iso_string,
              kind,
              count
            FROM agg_post_kind_count_1_minute
            WHERE bucket < (SELECT max(bucket) FROM agg_post_kind_count_1_minute) - INTERVAL '60' SECOND
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '60' SECOND

          delete_closed_windows_sql: |
            DELETE FROM agg_post_kind_count_1_minute
            WHERE bucket < (SELECT max(bucket) FROM agg_post_kind_count_1_minute) - INTERVAL '60' SECOND
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '60' SECOND

        sink:
          type: kafka
          kafka:
            brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
            topic: output-bluesky-post-kind-count-1-minute

pipeline:
  batch_size: 1
  source:
    type: websocket
    websocket:
      uri: 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post'

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      INSERT INTO agg_post_kind_count_1_minute
      SELECT
        time_bucket(INTERVAL '1 minute', to_timestamp(time_us / 1000000)) as bucket,
        kind,
        count(*) as count
      FROM batch
      GROUP BY 
        bucket, kind 
      ON CONFLICT (bucket, kind)
      DO UPDATE SET count = count + EXCLUDED.count

  sink:
    type: noop
