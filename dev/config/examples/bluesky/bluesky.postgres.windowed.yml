# Counts Bluesky posts per minute by language in a 1-minute tumbling window
# and writes each closed window to Postgres.
commands:
  - name: load postgres extension
    sql: |
      INSTALL postgres;
      LOAD postgres;

  - name: attach postgres
    sql: |
      ATTACH '{{ SQLFLOW_POSTGRES_URI|default('postgresql://postgres:postgres@sqlflow-postgres:5432/postgres') }}' AS pg (TYPE POSTGRES);

  - name: declare the post schema
    sql: |
      CREATE TABLE IF NOT EXISTS posts (
        time_us BIGINT,
        commit STRUCT(
          operation TEXT,
          record STRUCT(langs TEXT[])
        )
      );

tables:
  sql:
    - name: posts_per_minute_by_lang
      sql: |
        CREATE TABLE IF NOT EXISTS posts_per_minute_by_lang (
          bucket TIMESTAMP,
          lang TEXT,
          posts INTEGER
        );
        CREATE UNIQUE INDEX IF NOT EXISTS posts_per_minute_by_lang_idx
          ON posts_per_minute_by_lang (bucket, lang);

      manager:
        # The grace period outlives the batch wait on purpose. A batch flushes
        # when it fills or after flush_interval_seconds, so an event from the
        # last seconds of a window can reach DuckDB up to that long after the
        # window ended. A grace period shorter than the batch wait publishes
        # the window before those events land.
          # A window closes against the stream's own clock, not wall clock.
          # max(bucket) is the newest window the data has reached, so a window
          # closes only once the stream has moved past it. That keeps the
          # result identical whether the data arrives live or as a replay.
          #
          # With now() here instead, a pipeline running behind real time by
          # more than the grace period closes a window whose rows are still
          # arriving and publishes it in parts, once per poll. Downstream those
          # parts are indistinguishable from an at-least-once duplicate.
          #
          # The trade: the newest window waits for a later one, so a stream
          # that stops leaves its final window unpublished.
          #
          # The second branch is the idleness bound. A stream that goes quiet
          # never moves its own clock, so the first branch alone would hold
          # the newest window open until data a full grace newer arrived: a
          # surge that stops leaves its last bucket unpublished forever.
          # sqlflow_progress is the engine's one-row liveness table and
          # last_arrival is when the newest batch was written, so after a
          # grace of silence every open window closes. It is TIMESTAMPTZ, so
          # the comparison holds whatever timezone the host runs in.
        tumbling_window:
          poll_interval_seconds: 10
          collect_closed_windows_sql: |
            SELECT bucket, lang, posts
            FROM posts_per_minute_by_lang
            WHERE bucket + INTERVAL '1 minute' < (SELECT max(bucket) FROM posts_per_minute_by_lang) - INTERVAL '60 seconds'
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '1 minute'
          delete_closed_windows_sql: |
            DELETE FROM posts_per_minute_by_lang
            WHERE bucket + INTERVAL '1 minute' < (SELECT max(bucket) FROM posts_per_minute_by_lang) - INTERVAL '60 seconds'
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '1 minute'

        sink:
          type: sqlcommand
          sqlcommand:
            # ON CONFLICT is what keeps at-least-once delivery survivable. The
            # manager deletes a window only after the sink accepts it, so a
            # crash between the two republishes that window on the next poll.
            # Against the target table's primary key on (bucket, lang), a bare
            # INSERT fails that republish -- and because the failed flush also
            # blocks the delete, every later poll collects the same rows and
            # fails the same way. One duplicate stops the pipeline publishing
            # anything, ever again.
            sql: |
              INSERT INTO pg.posts_per_minute_by_lang (bucket, lang, posts)
              SELECT bucket, lang, posts FROM sqlflow_sink_batch
              ON CONFLICT (bucket, lang) DO UPDATE SET posts = EXCLUDED.posts

pipeline:
  name: bluesky-posts-per-minute-by-lang
  batch_size: 500

  source:
    type: websocket
    websocket:
      uri: 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post'

  handler:
    type: handlers.StructuredBatch
    table: posts
    sql: |
      INSERT INTO posts_per_minute_by_lang
      SELECT
        date_trunc('minute', make_timestamp(time_us)) AS bucket,
        coalesce(commit.record.langs[1], 'unknown') AS lang,
        count(*) AS posts
      FROM posts
      WHERE commit.operation = 'create'
      GROUP BY bucket, lang
      ON CONFLICT (bucket, lang) DO UPDATE SET posts = posts + EXCLUDED.posts

  sink:
    type: noop
