# Counts Bluesky posts per minute by language in a 1-minute tumbling window
# and writes each closed window to Postgres.
commands:
  - name: declare the post schema
    sql: |
      CREATE TABLE IF NOT EXISTS posts (
        time_us BIGINT,
        event_time TIMESTAMPTZ,
        commit STRUCT(
          operation TEXT,
          record STRUCT(langs TEXT[])
        )
      );

tables:
  sql:
    - name: posts_per_minute_by_lang
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the engine deletes every closed window, so an index
      # grows memory without bound. Each batch appends its own counts and
      # emit_sql sums them per minute and language. See #268.
      #
      # bucket is TIMESTAMPTZ, an instant, so the write into a Postgres
      # TIMESTAMPTZ column needs no interpretation and the watermark compares
      # instants.
      sql: |
        CREATE TABLE IF NOT EXISTS posts_per_minute_by_lang (
          bucket TIMESTAMPTZ,
          lang TEXT,
          posts INTEGER
        );

      # The engine closes the window against a watermark in event time: the
      # newest bucket the data has reached, less the grace. The grace outlives
      # the batch wait on purpose. A batch flushes when it fills or after
      # flush_interval_seconds, so an event from the last seconds of a window
      # can reach DuckDB up to that long after the window ended. A grace
      # shorter than the batch wait publishes the window before those events
      # land. After idle_close_seconds with nothing arriving, every open
      # bucket closes.
      #
      # allowed_lateness_seconds keeps a closed minute's rows for five more
      # minutes. A post that arrives for it in that time is written, and the
      # minute is republished whole -- emit_sql over every row it has -- so
      # the upsert below replaces the row for (bucket, lang) with the exact
      # count. Past that a late post is refused before the handler and
      # counted in window_late_rows_total. This is the one shipped example
      # that admits late rows, because its sink replaces by key.
      window:
        time_column: bucket
        size_seconds: 60
        grace_seconds: 60
        idle_close_seconds: 60
        allowed_lateness_seconds: 300
        emit_sql: |
          SELECT bucket, lang, sum(posts)::INTEGER AS posts
          FROM closed
          GROUP BY ALL
        sink:
          # A keyed sink replaces the row a (bucket, lang) already identifies.
          # The engine deletes a window only after the sink accepts it, so a
          # crash between the two republishes that window on the next pass,
          # and the republish lands harmlessly; so does a late post's
          # recompute. Each flush costs the batch: a
          # COPY into a staging table and a server-side merge, in one
          # transaction. The target needs PRIMARY KEY (bucket, lang) or a
          # unique index on the pair; the sink checks at startup.
          type: postgres
          postgres:
            dsn: "{{ SQLFLOW_POSTGRES_URI|default('postgresql://postgres:postgres@sqlflow-postgres:5432/postgres') }}"
            table: posts_per_minute_by_lang
            mode: upsert
            key: [bucket, lang]

pipeline:
  name: bluesky-posts-per-minute-by-lang
  batch_size: 500

  source:
    type: websocket
    websocket:
      uri: 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post'
      # The post's own time: time_us, microseconds since the epoch. The
      # engine fills the batch table's event_time column from it.
      event_time:
        path: time_us
        format: unix_us

  handler:
    type: handlers.StructuredBatch
    table: posts
    sql: |
      INSERT INTO posts_per_minute_by_lang
      SELECT
        time_bucket(INTERVAL '1 minute', event_time) AS bucket,
        coalesce(commit.record.langs[1], 'unknown') AS lang,
        count(*) AS posts
      FROM posts
      WHERE commit.operation = 'create'
      GROUP BY bucket, lang

  sink:
    type: noop
