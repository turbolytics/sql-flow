# Counts Bluesky posts per minute by language in a 1-minute tumbling window
# and writes each closed window to Postgres.
commands:
  - name: load postgres extension
    sql: |
      INSTALL postgres;
      LOAD postgres;

  - name: attach postgres
    sql: |
      ATTACH '{{ SQLFLOW_POSTGRES_URI|default('postgresql://postgres:postgres@sqlflow-postgres:5432/postgres') }}' AS pg (TYPE POSTGRES);

  - name: declare the post schema
    sql: |
      CREATE TABLE IF NOT EXISTS posts (
        time_us BIGINT,
        commit STRUCT(
          operation TEXT,
          record STRUCT(langs TEXT[])
        )
      );

tables:
  sql:
    - name: posts_per_minute_by_lang
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the engine deletes every closed window, so an index
      # grows memory without bound. Each batch appends its own counts and
      # emit_sql sums them, so the Postgres upsert below still sees each key
      # once. See #268.
      #
      # bucket is TIMESTAMPTZ, an instant, so the write into a Postgres
      # TIMESTAMPTZ column needs no interpretation and the watermark compares
      # instants.
      sql: |
        CREATE TABLE IF NOT EXISTS posts_per_minute_by_lang (
          bucket TIMESTAMPTZ,
          lang TEXT,
          posts INTEGER
        );

      # The engine closes the window against a watermark in event time: the
      # newest bucket the data has reached, less the grace. The grace outlives
      # the batch wait on purpose. A batch flushes when it fills or after
      # flush_interval_seconds, so an event from the last seconds of a window
      # can reach DuckDB up to that long after the window ended. A grace
      # shorter than the batch wait publishes the window before those events
      # land. After idle_close_seconds with nothing arriving, every open
      # bucket closes.
      #
      # late_rows: reemit, because the sink upserts: a row for a bucket that
      # already closed publishes the bucket again, and ON CONFLICT replaces
      # the value.
      window:
        time_column: bucket
        size_seconds: 60
        grace_seconds: 60
        idle_close_seconds: 60
        late_rows: reemit
        poll_interval_seconds: 10
        emit_sql: |
          SELECT bucket, lang, sum(posts)::INTEGER AS posts
          FROM closed
          GROUP BY ALL
        sink:
          type: sqlcommand
          sqlcommand:
            # ON CONFLICT is what keeps at-least-once delivery survivable. The
            # engine deletes a window only after the sink accepts it, so a
            # crash between the two republishes that window on the next poll.
            # Against the target table's primary key on (bucket, lang), a bare
            # INSERT fails that republish, and because the failed flush stops
            # the process, one duplicate stops the pipeline publishing
            # anything, ever again.
            sql: |
              INSERT INTO pg.posts_per_minute_by_lang (bucket, lang, posts)
              SELECT bucket, lang, posts FROM sqlflow_sink_batch
              ON CONFLICT (bucket, lang) DO UPDATE SET posts = EXCLUDED.posts

pipeline:
  name: bluesky-posts-per-minute-by-lang
  batch_size: 500

  source:
    type: websocket
    websocket:
      uri: 'wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post'

  handler:
    type: handlers.StructuredBatch
    table: posts
    sql: |
      INSERT INTO posts_per_minute_by_lang
      SELECT
        time_bucket(INTERVAL '1 minute', to_timestamp(time_us / 1000000)) AS bucket,
        coalesce(commit.record.langs[1], 'unknown') AS lang,
        count(*) AS posts
      FROM posts
      WHERE commit.operation = 'create'
      GROUP BY bucket, lang

  sink:
    type: noop
