# Every sensor reading from MQTT into a DuckDB file. Production sets
# SQLFLOW_OUTPUT_DB=md:iot and writes to MotherDuck with no other change.
commands:
  - name: attach output
    sql: |
      ATTACH '{{ SQLFLOW_OUTPUT_DB|default('/data/iot.duckdb') }}' AS iot
  - name: bound memory
    sql: |
      SET memory_limit = '{{ SQLFLOW_DUCKDB_MEMORY|default('256MB') }}'
  # The declared shape of one reading. The structured handler parses each
  # publish against it and writes NULL for a field that does not fit. The
  # inferred handler instead fails the whole batch on one mistyped reading,
  # and under IGNORE that batch's good readings were acknowledged and
  # dropped: one {"value": "err"} lost 999 readings from every sensor.
  - name: create reading buffer
    sql: |
      CREATE TABLE reading (
        device_id VARCHAR,
        sensor VARCHAR,
        metric VARCHAR,
        value DOUBLE,
        unit VARCHAR,
        seq BIGINT,
        ts VARCHAR
      )
  - name: create readings
    sql: |
      CREATE TABLE IF NOT EXISTS iot.readings (
        device_id VARCHAR,
        sensor VARCHAR,
        metric VARCHAR,
        value DOUBLE,
        unit VARCHAR,
        seq BIGINT,
        ts TIMESTAMPTZ
      )

pipeline:
  name: mqtt-duckdb-raw
  description: "Sensor readings from MQTT into a DuckDB file"
  # At most receive_maximum. The broker stops sending at that many
  # unacknowledged publishes, and the source acknowledges only on commit.
  batch_size: {{ SQLFLOW_BATCH_SIZE|default(1000) }}
  flush_interval_seconds: 5

  source:
    type: mqtt
    mqtt:
      broker: {{ SQLFLOW_MQTT_BROKER|default('tcp://localhost:1883') }}
      client_id: {{ SQLFLOW_MQTT_CLIENT_ID|default('sqlflow-edge-1') }}
      topics: ["sensors/#"]

  # One device sending a bad reading must not crash-loop the pipeline. The
  # broker would redeliver it forever and stall every other sensor. With the
  # structured handler, a bad reading costs only itself.
  on_error:
    policy: IGNORE

  handler:
    type: 'handlers.StructuredBatch'
    table: reading
    # TRY_CAST, because a failed cast fails the batch as surely as a failed
    # parse. A reading with no seq is not a reading: a publish that was not
    # JSON parses to all NULLs.
    sql: |
      SELECT
        device_id,
        sensor,
        metric,
        value,
        unit,
        seq,
        TRY_CAST(ts AS TIMESTAMPTZ) AS ts
      FROM reading
      WHERE seq IS NOT NULL

  sink:
    type: sqlcommand
    sqlcommand:
      sql: |
        INSERT INTO iot.readings BY NAME SELECT * FROM sqlflow_sink_batch
