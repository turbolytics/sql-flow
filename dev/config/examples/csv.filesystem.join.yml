pipeline:
  batch_size: 1000
  source:
    type: kafka
    kafka:
      brokers: [localhost:9092]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('topic-csv-filesystem-join') }}

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT
        state_full,
        count(*) as city_count
      FROM batch
      JOIN read_csv('{{ STATIC_ROOT }}/fixtures/locations.csv', auto_detect=True, header=True) as locations ON
      (
        locations.city = properties.city 
      )
      GROUP BY
        state_full
      ORDER BY state_full DESC

  sink:
    type: kafka
    kafka:
      brokers: [localhost:9092]
      topic: {{ SQLFLOW_OUTPUT_TOPIC|default('output-csv-filesystem-join') }}