# Log reduction, part 2 of 2: the rollup.
#
# Hourly request and byte counts per route class and status, into ClickHouse.
# Runs as its own instance under its own consumer group, alongside
# logs.archive.parquet.yml on the same topic.
#
# Verified end to end against the NASA-HTTP traces (https://ita.ee.lbl.gov/):
# 3,461,613 records in, 84,329 rows out, 373,056,138 bytes of log to 1,035,798
# bytes in ClickHouse. 360x smaller, 41x fewer rows. Throughput about 180k
# messages a second; the regex is what costs.
#
# The rollup is lossy by construction. It cannot answer which host made a
# request or when inside the hour, which is what the archive is for.
#
# The target table:
#
#   CREATE TABLE nasa_http_rollup (
#       bucket      DateTime,
#       route_class String,
#       status      UInt16,
#       requests    UInt64,
#       bytes       UInt64
#   ) ENGINE = MergeTree() ORDER BY (bucket, route_class, status);
#
# Each bucket is published once, so a row is the hour's count.
tables:
  sql:
    - name: agg_logs_rollup
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the engine deletes every closed window, so an index
      # grows memory without bound. Each batch appends its own partial counts
      # and emit_sql sums them. See #268.
      sql: |
        CREATE TABLE agg_logs_rollup (
          bucket TIMESTAMPTZ,
          route_class VARCHAR,
          status SMALLINT,
          requests BIGINT,
          bytes BIGINT
        );

      window:
        time_column: bucket
        size_seconds: 3600
        grace_seconds: 7200
        # The close waits for the engine to commit ten seconds after the last
        # arrival, and with nothing arriving it commits once a flush interval,
        # so pipeline.flush_interval_seconds below is set to match. At the
        # default of thirty the last buckets would close 10 to 40 seconds
        # after the corpus ends.
        idle_close_seconds: 10
        # No lateness. A record is late when its bucket ended at or before
        # the watermark, and the watermark is asserted in the commit that
        # makes a batch's rows visible: nothing in a batch is late against
        # the batch's own newest record, so an in-order corpus is never late
        # here, whatever the batch size. A record that is late is refused
        # before the handler and counted in window_late_rows_total.
        # allowed_lateness_seconds above 0 would republish a bucket whole,
        # and the ClickHouse sink inserts rows rather than replacing them.
        emit_sql: |
          SELECT
            strftime(bucket, '%Y-%m-%d %H:%M:%S') AS bucket,
            route_class,
            status,
            sum(requests)::BIGINT AS requests,
            sum(bytes)::BIGINT AS bytes
          FROM closed
          GROUP BY ALL
        sink:
          type: clickhouse
          clickhouse:
            dsn: {{ SQLFLOW_CLICKHOUSE_DSN|default('clickhouse://localhost:8123/test') }}
            table: {{ SQLFLOW_CLICKHOUSE_TABLE|default('nasa_http_rollup') }}

pipeline:
  name: logs-rollup-clickhouse
  batch_size: {{ SQLFLOW_BATCH_SIZE|default(50000) }}
  flush_interval_seconds: 10

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('logs-rollup') }}
      auto_offset_reset: earliest
      fetch:
        # The byte bounds are the defaults and are left alone. Only the depth
        # moves: one fetch ahead rather than two, measured on the NASA corpus
        # at 185 MiB container peak and 214k msgs/sec against 193 MiB and 206k
        # at the default depth, with byte-identical output. A single-partition
        # log stream gains little from the extra fetch in flight.
        prefetch: 1
      # The request's own time, which publish-logs forwards under `ts` as a
      # shipper that has already read the line would. Without this the engine
      # falls back to the Kafka record timestamp, which is when the replay ran
      # rather than when the request happened, and every bucket in the trace
      # collapses into the hour the corpus was published.
      #
      # Publish with -event-time-field ts -shift-to-now. The shift is not
      # cosmetic: the engine refuses an event time before EventTimeFloor, and
      # a corpus older than that publishes nothing at all. Shifting preserves
      # every interval between records, so the buckets, their counts and the
      # reduction ratio are the trace's; only the labels move.
      event_time:
        path: ts
        format: rfc3339
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('nasa-http') }}

  handler:
    type: 'handlers.InferredMemBatch'
    # Cardinality control is where the reduction comes from, and it is the whole
    # trick. Grouping by raw path barely reduces anything: the NASA July trace
    # alone holds 21,214 distinct paths, most of them near-unique. The route
    # class drops the filename, keeps two directory segments, folds digit runs
    # to N, and classifies by extension -- 21,214 paths become 3,423 classes,
    # and /shuttle/missions/sts-73/mission-sts-73.html becomes
    # /shuttle/missions/*.html.
    #
    # The trailing '^//' replacement is not cosmetic: a path with a single
    # segment has no directory left once the filename is dropped, which would
    # otherwise render as //*.html.
    #
    # The bucket is cut on event_time, which the source reads from the `ts`
    # field publish-logs writes beside the raw line. A line whose timestamp
    # does not parse carries no `ts`, so the source has nothing to read and
    # the record is refused; the archive pipeline keeps it in full either way.
    #
    # The regex still extracts `ts` from the line and the rollup ignores it.
    # That is deliberate: the handler must bucket on the time the engine
    # assigned, not on one it parses for itself, or the engine decides a
    # record's lateness against a bucket the row is not in.
    sql: |
      WITH m AS (
        SELECT regexp_extract(message,
          '^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) (\S+)[^"]*" (\d{3}) (\S+)$',
          ['host','ts','method','path','status','bytes']) AS f,
          event_time
        FROM batch
      ),
      s AS (
        SELECT f.*,
          string_split(trim(f.path,'/'),'/') AS segs,
          lower(regexp_extract(f.path,'\.([a-zA-Z0-9]+)$',1)) AS ext,
          event_time
        FROM m
      )
      INSERT INTO agg_logs_rollup BY NAME
      SELECT
        time_bucket(INTERVAL '1 hour', event_time) AS bucket,
        regexp_replace(
          regexp_replace(
            '/'||array_to_string(list_slice(
              CASE WHEN ext<>'' THEN list_slice(segs,1,len(segs)-1) ELSE segs END,1,2),'/'),
            '[0-9]+','N','g'),
          '^//','/') AS route_class,
        TRY_CAST(status AS SMALLINT) AS status,
        count(*) AS requests,
        sum(TRY_CAST(bytes AS BIGINT)) AS bytes
      FROM s
      GROUP BY 1,2,3

  # The handler's statement is an INSERT into the windowed table, so it returns
  # no rows for a sink to write. The window has its own sink, above.
  sink:
    type: noop
