# A windowed aggregation with durable state.
#
# pipeline.state.path makes DuckDB file-backed, so the window table and the
# Kafka offsets that produced it are committed together in one transaction.
# Without it, state lives in memory: a crash mid-window loses that window's
# aggregate while its offsets are already committed, silently, with the
# consumer group reporting no lag.
#
# The close predicate here is deliberately an hour, so the window stays open
# for the length of a test run and recovery can be observed on a partial
# aggregate rather than one that has already been published and deleted.
tables:
  sql:
    - name: agg_city_count
      # No UNIQUE INDEX, on purpose. DuckDB never frees rows deleted from an
      # indexed table, and the manager deletes every closed window, so an index
      # grows memory and the state file without bound. A state path does not
      # avoid it. Each batch appends its own counts and the collect query sums
      # them. See #268.
      sql: |
        CREATE TABLE IF NOT EXISTS agg_city_count (
          bucket TIMESTAMPTZ,
          city VARCHAR,
          count INT
        );

      manager:
          # A window closes against the stream's own clock, not wall clock.
          # max(bucket) is the newest window the data has reached, so a window
          # closes only once the stream has moved past it. That keeps the
          # result identical whether the data arrives live or as a replay.
          #
          # With now() here instead, a pipeline running behind real time by
          # more than the grace period closes a window whose rows are still
          # arriving and publishes it in parts, once per poll. Downstream those
          # parts are indistinguishable from an at-least-once duplicate.
          #
          # The trade: the newest window waits for a later one, so a stream
          # that stops leaves its final window unpublished.
          #
          # The second branch is the idleness bound. A stream that goes quiet
          # never moves its own clock, so the first branch alone would hold
          # the newest window open until data a full grace newer arrived: a
          # surge that stops leaves its last bucket unpublished forever.
          # sqlflow_progress is the engine's one-row liveness table and
          # last_arrival is when the newest batch was written, so after a
          # grace of silence every open window closes. It is TIMESTAMPTZ, so
          # the comparison holds whatever timezone the host runs in.
        tumbling_window:
          poll_interval_seconds: 3600
          # GROUP BY ALL groups by the output columns. GROUP BY bucket would
          # group by the table's bucket column, which the output renames.
          collect_closed_windows_sql: |
            SELECT
              strftime(bucket, '%Y-%m-%dT%H:%M:%S') AS bucket,
              city,
              sum(count)::INT AS count
            FROM agg_city_count
            WHERE bucket < (SELECT max(bucket) FROM agg_city_count) - INTERVAL '3600' SECOND
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '3600' SECOND
            GROUP BY ALL
          delete_closed_windows_sql: |
            DELETE FROM agg_city_count
            WHERE bucket < (SELECT max(bucket) FROM agg_city_count) - INTERVAL '3600' SECOND
               OR (SELECT now() - last_arrival FROM sqlflow_progress) > INTERVAL '3600' SECOND

        sink:
          type: console

pipeline:
  name: stateful-window
  batch_size: {{ SQLFLOW_BATCH_SIZE|default('250') }}

  state:
    path: {{ SQLFLOW_STATE_PATH|default('/tmp/sqlflow/state.db') }}

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('stateful-window') }}
      auto_offset_reset: earliest
      topics:
        - "{{ SQLFLOW_TOPIC|default('input-stateful-window') }}"

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      INSERT INTO agg_city_count
      BY NAME
      SELECT
        date_trunc('hour', CAST(timestamp AS TIMESTAMPTZ)) AS bucket,
        properties.city AS city,
        count(*) AS count
      FROM batch
      GROUP BY bucket, city

  sink:
    type: noop
