pipeline:
  batch_size: 5000

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('input-kafka-mem-iceberg') }}

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT
         CAST(timestamp as TIMESTAMP) as timestamp,
        properties.city as city
      FROM batch
      ORDER BY timestamp, city DESC

  sink:
    type: iceberg
    iceberg:
      catalog_name: {{ SQLFLOW_CATALOG_NAME|default('sqlflow_test') }}
      table_name: {{ SQLFLOW_TABLE_NAME|default('default.city_events') }}
