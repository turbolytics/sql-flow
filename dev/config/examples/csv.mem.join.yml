commands:
  - name: register locations CSV view
    sql: |
      CREATE VIEW locations AS
        SELECT 
          *
        FROM read_csv_auto('{{ STATIC_ROOT }}/fixtures/locations.csv', header=True);

pipeline:
  batch_size: 1000

  source:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      group_id: {{ SQLFLOW_GROUP_ID|default('test') }}
      auto_offset_reset: earliest
      topics:
        - {{ SQLFLOW_INPUT_TOPIC|default('topic-csv-mem-join') }}

  handler:
    type: 'handlers.InferredMemBatch'
    sql: |
      SELECT
        properties.city,
        state_full
      FROM batch
      LEFT JOIN (
        SELECT *
          FROM locations
          WHERE locations.city = properties.city 
        LIMIT 1 
      ) AS single_location ON single_location.city = properties.city
      ORDER BY properties.city ASC;

  sink:
    type: kafka
    kafka:
      brokers: [{{ SQLFLOW_KAFKA_BROKERS|default('localhost:9092') }}]
      topic: {{ SQLFLOW_OUTPUT_TOPIC|default('output-csv-mem-join') }}
