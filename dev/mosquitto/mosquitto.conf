# Mosquitto for the SQLFlow MQTT POC. Every setting here guards against loss
# under SQLFlow's contract: QoS 1, a persistent session, and PUBACK only on
# commit.
listener 1883
allow_anonymous true

# The default, 1000, drops every publish past it for an offline session. With
# SQLFlow down, 4,000 of 5,000 publishes vanished with no error. Unlimited
# trades that loss for memory: Mosquitto holds queued publishes in RAM. The
# POC measures RSS per queued message to size max_queued_bytes for the Pi.
max_queued_messages 0

# Without persistence a broker restart drops every session and its queue.
persistence true
persistence_location /mosquitto/data/

# Mosquitto writes its in-memory state to disk only at shutdown or on this
# interval. A kill -9 loses up to one interval.
autosave_interval 1

log_dest stdout
