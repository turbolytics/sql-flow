# The invariants every integration must hold, and the evidence each requires.
#
# This file is declared, not derived, for the reason features.yml gives: the
# failure it catches is an integration with no evidence at all. Ten of these
# have been violated and fixed since v1.0.4, and each of those rows names the
# fix.
#
# `applies_to` is the interface the invariant is a property of. Every
# integration of that kind must prove it, or be exempt in the registry
# with a reason.
#
# `verified_by` says how evidence attaches:
#
#   harness    internal/conformance emits COVERS invariant=... integration=...
#   typetable  the generated type round-trip emits the same marker per type
#
# Both are explicit markers: a test says what it proves. There is no way to
# attribute an invariant by test name -- `named` was declared here once,
# never implemented, and dropped as a third way to claim the same evidence.
# scripts/coverage_matrix accepts the two above and nothing else.
#
# `requires` lists the levels evidence must exist at. Every entry is empty in
# this revision: the matrix reports, and nothing fails. An invariant is
# enforced by filling one in, which is legal only once every non-exempt
# integration has a subject.
#
# `tracked_by` marks an invariant the code does not yet satisfy. It renders as
# declared-unenforced until that issue lands.

invariants:
  # --- Resilience: the sink contract ---------------------------------------
  - id: sink.write.buffers_only
    family: resilience
    class: safety
    applies_to: sink
    claim: WriteTable does not reach the destination. Only Flush does.
    verified_by: harness
    requires: []
    # Every sink proves this, so a new one cannot merge without a conformance
    # subject. The level is the integration's business: ClickHouse and Kafka
    # need a container, console and sqlcommand fail in-process.
    enforced: true

  - id: sink.flush.keeps_batch
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      A failed Flush leaves every undelivered row buffered. The next Flush
      re-attempts them. Delivery is at-least-once, so a row that arrives twice
      holds the claim and a row that never arrives breaks it.
    verified_by: harness
    requires: []
    enforced: true
    violated_once: ["#221"]

  - id: sink.flush.no_hollow_success
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      Flush returns nil only when every row since the last success was
      acknowledged by the destination.
    verified_by: harness
    requires: []
    violated_once: ["#221"]

  - id: sink.rows.counted_on_delivery
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      sink_rows_written counts a row once, when a Flush acknowledged it. A
      failed flush counts nothing; the retry that delivers those rows counts
      them.
    verified_by: harness
    requires: []

  - id: sink.flush.preserves_order
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      Rows reach the destination in WriteTable order, across a retry. Repeats
      are permitted, because delivery is at-least-once; a row that overtakes one
      written before it is not.
    verified_by: harness
    requires: []

  - id: sink.flush.honours_context
    family: resilience
    class: safety
    applies_to: sink
    claim: Flush returns ctx.Err() when the context ends. Rows stay buffered.
    verified_by: harness
    requires: []
    violated_once: ["#219"]

  - id: sink.flush.empty_is_noop
    family: resilience
    class: safety
    applies_to: sink
    claim: Flush with nothing buffered returns nil and touches nothing.
    verified_by: harness
    requires: []

  - id: sink.buffer.reports_depth
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      A sink reports how many rows it is holding, and the count rises when a
      flush fails and falls to zero when one succeeds.
    verified_by: harness
    requires: []
    enforced: true

  - id: sink.error.classifies
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      The sink's errors classify as unreachable, rejected, or a user fault,
      so the retry ladder retries only the first. A value the sink's client
      cannot encode is a user fault: it never reaches the network and fails
      the same way every attempt.
    verified_by: harness
    requires: []

  - id: sink.probe.fails_start
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      A Prober whose destination is unreachable fails the start once, without
      retrying.
    verified_by: harness
    requires: []

  - id: sink.flush.idempotent_on_key
    family: resilience
    class: safety
    applies_to: sink
    claim: >
      Delivering the same batch twice leaves the destination holding it once.
      The engine promises at-least-once; a sink that identifies rows by key is
      what turns that into exactly-once for the reader. A sink that declares
      no key is exempt, with a proof that it declares none.
    verified_by: harness
    requires: []

  # --- Checkpoint: the pipeline and source contract ------------------------
  - id: pipeline.commit.after_flush
    family: checkpoint
    class: safety
    applies_to: pipeline
    claim: Offsets and state commit only after Flush returned nil.
    verified_by: harness
    requires: []
    enforced: true

  # The property pipeline.commit.after_flush approximates. after_flush asserts
  # the order the loop does things, which is a mechanism: a correct rewrite
  # that committed optimistically and rolled back would fail it. This asserts
  # the outcome, against rows a destination actually holds, so it survives any
  # implementation that keeps the guarantee.
  - id: pipeline.commit.only_delivered_rows
    family: checkpoint
    class: safety
    applies_to: pipeline
    claim: >
      The pipeline never commits a position covering a row the destination did
      not take, and never leaves a delivered row uncommitted after a clean run.
    verified_by: harness
    requires: []
    enforced: true
    violated_once: ["#154"]

  # The same guarantee as only_delivered_rows, judged after the consume loop
  # returns. run commits again on the way out, syncing state before and after
  # the table managers' final poll, and every other pipeline check stops at
  # the loop's return. Positions advance when a message reaches the handler,
  # before its batch is flushed, so a batch the sink refused left positions
  # the shutdown then made durable.
  - id: pipeline.shutdown.commits_only_delivered
    family: checkpoint
    class: safety
    applies_to: pipeline
    claim: >
      After the consume loop returns, clean or failed, the commits the process
      makes on its way out never make a position durable past the last
      message the sink acknowledged. Not in the state database, and not at
      the source.
    verified_by: harness
    requires: []
    enforced: true
    violated_once: ["#279"]

  - id: pipeline.commit.nothing_on_failure
    family: checkpoint
    class: safety
    applies_to: pipeline
    claim: A failed flush commits nothing. Not offsets, not state.
    verified_by: harness
    requires: []
    enforced: true

  - id: pipeline.state.with_offsets
    family: checkpoint
    class: safety
    applies_to: pipeline
    claim: Window state and the offsets that produced it commit atomically.
    verified_by: harness
    requires: []
    enforced: true

  - id: source.commit.only_processed
    family: checkpoint
    class: safety
    applies_to: source
    claim: >
      A source commits the marks the pipeline processed, never what it
      fetched.
    verified_by: harness
    requires: []
    violated_once: ["#154"]

  - id: source.resume.from_committed
    family: checkpoint
    class: safety
    applies_to: source
    claim: >
      Restart resumes at the committed position. No gap, and no replay before
      it.
    verified_by: harness
    requires: []

  - id: source.marks.never_regress
    family: checkpoint
    class: safety
    applies_to: source
    claim: A committed position never moves backwards.
    verified_by: harness
    requires: []

  - id: source.commit.on_revoke
    family: checkpoint
    class: safety
    applies_to: source
    claim: >
      Marks commit when a partition is revoked, before the rebalance
      completes.
    verified_by: harness
    requires: []
    tracked_by: "#183"

  # --- Types: per integration, from its declared table ---------------------
  - id: type.roundtrip
    family: types
    class: safety
    applies_to: sink
    claim: >
      Every declared Arrow type reads back with the declared outcome: exact,
      coerced by the stated rule, or unsupported with a coded error.
    verified_by: typetable
    requires: []
    violated_once: ["#147", "#150", "#151"]

  - id: type.null
    family: types
    class: safety
    applies_to: sink
    claim: A null in every declared type reads back as declared.
    verified_by: typetable
    requires: []

  - id: type.timestamp.instant
    family: types
    class: safety
    applies_to: sink
    claim: >
      A timestamp reads back as the same instant. Zone-less is UTC, and the
      host zone never leaks into the type.
    verified_by: typetable
    requires: []
    violated_once: ["#153"]

  - id: type.nested
    family: types
    class: safety
    applies_to: sink
    claim: >
      list, struct, list-of-struct and list-of-list read back, or are declared
      unsupported. Never silently flattened.
    verified_by: typetable
    requires: []

  - id: type.string.fidelity
    family: types
    class: safety
    applies_to: sink
    claim: Unicode, escapes and the empty string round-trip byte for byte.
    verified_by: typetable
    requires: []
    violated_once: ["#149"]

  - id: type.undeclared.fails_loud
    family: types
    class: safety
    applies_to: sink
    claim: >
      An Arrow type absent from the table fails the batch with a coded error.
      Never coerced silently.
    verified_by: typetable
    requires: []

  # --- Lifecycle -----------------------------------------------------------
  - id: lifecycle.drain.on_cancel
    family: lifecycle
    class: safety
    applies_to: pipeline
    claim: Cancel or SIGTERM flushes the buffered batch, then commits.
    verified_by: harness
    requires: []
    enforced: true

  # --- Liveness: the pipeline makes progress -------------------------------
  # Every claim above is safety: nothing bad happens. None of them says the
  # pipeline does anything, and a sink that never flushes satisfies all of
  # them. These are the claims that it does.
  - id: pipeline.flush.eventually
    family: lifecycle
    class: liveness
    applies_to: pipeline
    claim: >
      A batch that never reaches batchSize still reaches the sink, within the
      flush interval.
    verified_by: harness
    requires: []
    enforced: true

  - id: pipeline.progress.no_silent_stall
    family: lifecycle
    class: liveness
    applies_to: pipeline
    claim: >
      A configuration cannot remove the flush ticker. flush_interval_seconds
      absent, zero or negative all run with the thirty second default, so a
      batch a low-traffic topic never fills still leaves on time. This entry
      previously claimed the opposite, that zero removed the ticker and
      stalled such a topic forever; the run command has always defaulted it.

      Pinned by TestCliInvocation_FlushIntervalNeverZero, not by the harness,
      and unenforced for that reason: the harness drives a pipeline that is
      already constructed, and this is a property of resolving the config
      before construction. There is nothing per-subject to observe, so
      demanding a cell from every subject would buy a fake rather than a
      proof. The liveness the harness can see is pipeline.flush.eventually,
      which it proves.
    verified_by: harness
    requires: []
    enforced: false

  - id: lifecycle.drain.bounded
    family: lifecycle
    class: liveness
    applies_to: pipeline
    claim: >
      A drain finishes or fails inside pipeline.drain_deadline_seconds. A sink
      that never answers cannot hold the process past it: the loop returns
      system.lifecycle.drain_incomplete, commits nothing for the batch it
      could not write, and the next start replays it.
    verified_by: harness
    requires: []
    enforced: true

  - id: lifecycle.close.idempotent
    family: lifecycle
    class: safety
    applies_to: sink
    claim: Close twice is safe.
    verified_by: harness
    requires: []

  - id: pipeline.batch.timeout
    family: lifecycle
    class: liveness
    applies_to: pipeline
    claim: >
      A batch whose query exceeds the timeout fails the batch, not the
      process.
    verified_by: harness
    requires: []
    tracked_by: "#163"

  # --- Error policy --------------------------------------------------------
  - id: error.dlq.carries_provenance
    family: errors
    class: safety
    applies_to: pipeline
    claim: A DLQ record carries the payload, offset, partition and reason.
    verified_by: harness
    requires: []
    tracked_by: "#166"

  - id: error.bad_record.threshold
    family: errors
    class: safety
    applies_to: pipeline
    claim: >
      N bad records in a window fail the pipeline rather than discarding
      forever.
    verified_by: harness
    requires: []
    tracked_by: "#166"

  # --- Managers: a second loop that reaches a sink ------------------------
  # A watermark manager collects the buckets its watermark has passed,
  # flushes them, deletes them from the table, and advances the watermark.
  # The delete and the watermark are its commit, so these are the consume
  # loop's checkpoint claims restated for it, plus the liveness a poll loop
  # owes on its own, plus what the watermark adds. The manager is not a sink
  # and not a handler: it has a commit step and a liveness obligation, and a
  # handler has neither. internal/conformance drives it the way it drives
  # the loop.
  - id: manager.delete.after_flush
    family: checkpoint
    class: safety
    applies_to: manager
    claim: >
      Closed windows leave the state table only after the sink acknowledged
      them. The table still holds every one of them when Flush runs.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.delete.nothing_on_failure
    family: checkpoint
    class: safety
    applies_to: manager
    claim: >
      A failed flush deletes nothing. Every closed window stays in the state
      table for the next attempt.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.publish.eventually
    family: lifecycle
    class: liveness
    applies_to: manager
    claim: >
      A closed window reaches the sink without anything else happening. The
      loop polls on its own, and a window that closes is published.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.failure.exits
    family: lifecycle
    class: liveness
    applies_to: manager
    claim: >
      A poll the sink refuses stops the manager with the sink's error, after
      one attempt, and the process exits with its code. The sink ran its
      retry ladder before the error arrived, so the manager does not retry in
      place, and a window the destination will not take is never collected,
      written and refused every tick while the process reports healthy.
    verified_by: harness
    requires: []
    enforced: true
    violated_once: ["#267"]

  - id: manager.watermark.never_regresses
    family: checkpoint
    class: safety
    applies_to: manager
    claim: >
      The persisted watermark never moves backwards, across polls and across
      a restart. A manager built over the state another one saved publishes
      nothing that one published.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.close.committed_rows_only
    family: checkpoint
    class: safety
    applies_to: manager
    claim: >
      A close publishes rows the pipeline has committed and no others. Rows
      an open batch has written are not counted, so a batch that rolls back
      was never published.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.late.policy_holds
    family: checkpoint
    class: safety
    applies_to: manager
    claim: >
      A row for a bucket below the watermark is late. Under drop it is
      discarded and counted, and the bucket is never published again. Under
      reemit it is published once.
    verified_by: harness
    requires: []
    enforced: true

  - id: manager.drain.bounded
    family: lifecycle
    class: liveness
    applies_to: manager
    claim: >
      The final poll after a cancel finishes or fails inside the drain
      deadline. A sink that never answers cannot hold the process past it,
      and every closed window it did not deliver stays in the state table.
    verified_by: harness
    requires: []
    enforced: true

  # A window closes and publishes on DuckDB connections of its own (#281), so
  # the consume loop's lock no longer orders its statements against the
  # window's. #283's rule, every statement on the pipeline's connection holds
  # the lock, stopped reaching the window when it moved, and no row said so.
  # This one does, from the pipeline's side: whatever the window's I/O is
  # doing and however long it takes, a batch does not fail because of it.
  - id: pipeline.batch.independent_of_window_io
    family: lifecycle
    class: safety
    applies_to: manager
    claim: >
      A window's sink write or close, however long, never fails the consume
      loop. A batch that runs while the window's flush has not returned, or
      while its close has written the delete and the watermark and not
      committed them, succeeds, and the close still lands once released.
    verified_by: harness
    requires: []
    enforced: true
