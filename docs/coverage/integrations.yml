# Every integration sqlflow can construct, and what each one claims.
#
# One entry per case in sinks.buildSink, sources.New and handlers.New. A test
# in each of those packages holds Kinds() equal to the ids here, so a new case
# without an entry fails `go test -short` in seconds. An integration the
# engine can build and this file does not name has no invariant cells at all,
# which is the sink.iceberg failure: nothing written down, so nothing can be
# missing.
#
# `implements` lists the interfaces the integration satisfies beyond its
# kind's base contract. Prober means the sink checks its destination before
# the first batch arrives.
#
# `exempt` names invariants that cannot apply, each with a reason. An
# exemption is one of two statements that must agree: the harness skips what
# it cannot exercise, and this file excuses it. Either one alone leaves the
# cell missing.
#
# `feature` ties the entry to features.yml.

integrations:
  # --- Sinks ---------------------------------------------------------------
  - id: sink.kafka
    kind: sink
    implements: [Sink, Prober]
    feature: sink.kafka
    exempt: []

  - id: sink.clickhouse
    kind: sink
    implements: [Sink, Prober]
    feature: sink.clickhouse
    exempt: []

  # implements listed Prober and the sink has never had a Probe method. The
  # constructor loads the catalog and the table, so an absent table does fail
  # the start -- but through NewIcebergSink, not through the interface
  # sinks.New probes.
  - id: sink.iceberg
    kind: sink
    implements: [Sink]
    feature: sink.iceberg
    exempt:
      - invariant: sink.probe.fails_start
        reason: implements no Prober, so there is no start-time check to fail
        proven_by: TestSinkIceberg_ImplementsNoProber
      - invariant: lifecycle.close.idempotent
        reason: implements no Close; it holds no client to release
        proven_by: TestSinkIceberg_ImplementsNoCloser
      - invariant: sink.flush.honours_context
        reason: >
          appends through the catalog and the local filesystem, which fail
          immediately; no flush can still be running when a deadline arrives
        proven_by: TestSinkIceberg_FlushCannotOutliveItsContext
      # sink.flush.preserves_order is deliberately not exempt, and reads as
      # missing. The subject cannot observe delivery order -- a scan reads the
      # table's data files, and each append writes its own file with a
      # generated name, so a read-back of [id=2, id=1] turned up on roughly one
      # run in six. That is a limit of the read-back, not a property of the
      # sink, and an exemption claiming otherwise would be an excuse. The cell
      # stays missing until the subject can order a scan by arrival.

  - id: sink.sqlcommand
    kind: sink
    implements: [Sink]
    feature: sink.sqlcommand
    exempt:
      - invariant: sink.probe.fails_start
        reason: implements no Prober, so there is no start-time check to fail
        proven_by: TestSinkSqlcommand_ImplementsNoProber
      - invariant: sink.flush.honours_context
        reason: >
          runs the user's SQL on the pipeline's own DuckDB connection, which
          returns or fails immediately; no flush can still be running when a
          deadline arrives
        proven_by: TestSinkSqlcommand_FlushCannotOutliveItsContext
      - invariant: lifecycle.close.idempotent
        reason: >
          implements no Close; the DuckDB connection belongs to the pipeline
          and this sink must not close it
        proven_by: TestSinkSqlcommand_ImplementsNoCloser

  - id: sink.console
    kind: sink
    implements: [Sink]
    feature: sink.console
    exempt:
      - invariant: sink.probe.fails_start
        reason: implements no Prober, so there is no start-time check to fail
        proven_by: TestSinkConsole_ImplementsNoProber
      - invariant: sink.flush.honours_context
        reason: >
          writes to an io.Writer, which returns or fails immediately; no flush
          can still be running when a deadline arrives
        proven_by: TestSinkConsole_FlushCannotOutliveItsContext
      - invariant: lifecycle.close.idempotent
        reason: >
          implements no Close; the io.Writer belongs to its caller and this
          sink must not close it
        proven_by: TestSinkConsole_ImplementsNoCloser

  - id: sink.noop
    kind: sink
    implements: [Sink]
    feature: sink.noop
    # noop has no destination at all, which is its whole purpose: it exists so
    # a benchmark can measure the engine without a sink. Every invariant about
    # delivering rows is vacuous for it, and one test states that contract
    # directly rather than eight reasons asserting it.
    exempt:
      - invariant: sink.write.buffers_only
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.flush.keeps_batch
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.flush.no_hollow_success
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.flush.preserves_order
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.flush.honours_context
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.flush.empty_is_noop
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.buffer.reports_depth
        reason: has no destination; it holds nothing, so there is no depth to report
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.error.classifies
        reason: has no destination; discarding every row is the contract
        proven_by: TestSinkNoop_DeliversNothingAndSaysSo
      - invariant: sink.probe.fails_start
        reason: implements no Prober, so there is no start-time check to fail
        proven_by: TestSinkNoop_ImplementsNoProber
      - invariant: lifecycle.close.idempotent
        reason: implements no Close; it holds nothing to release
        proven_by: TestSinkNoop_ImplementsNoCloser

  # The conformance harness's own doubles run under this id.
  #
  # They must name an integration, because a marker carries one. Naming a real
  # sink would credit that sink for what a double did, and it would force
  # exemptions onto a customer-facing sink for reasons that have nothing to do
  # with its contract: the first invariant NoopSink genuinely satisfies would
  # have to be exempted anyway, hiding real coverage.
  #
  # test_only keeps it out of the matrix. Its markers are known, so they are
  # not reported as unknown, and they land on no cell.
  - id: sink.conformance_double
    kind: sink
    test_only: true
    implements: [Sink]
    exempt: []

  # --- Sources ---------------------------------------------------------------
  - id: source.kafka
    kind: source
    implements: [Source, MarkCommitter]
    feature: source.kafka
    exempt: []

  - id: source.websocket
    kind: source
    implements: [Source]
    feature: source.websocket
    exempt:
      - invariant: source.commit.only_processed
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebsocket_ImplementsNoMarkCommitter
      - invariant: source.resume.from_committed
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebsocket_ImplementsNoMarkCommitter
      - invariant: source.marks.never_regress
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebsocket_ImplementsNoMarkCommitter
      - invariant: source.commit.on_revoke
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebsocket_ImplementsNoMarkCommitter

  - id: source.webhook
    kind: source
    implements: [Source]
    feature: source.webhook
    exempt:
      - invariant: source.commit.only_processed
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebhook_ImplementsNoMarkCommitter
      - invariant: source.resume.from_committed
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebhook_ImplementsNoMarkCommitter
      - invariant: source.marks.never_regress
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebhook_ImplementsNoMarkCommitter
      - invariant: source.commit.on_revoke
        reason: implements no MarkCommitter; at-most-once by construction
        proven_by: TestSourceWebhook_ImplementsNoMarkCommitter

  # --- Pipelines -------------------------------------------------------------
  # Configurations of the consume loop. Nothing in a config file names one, so
  # `constructed: false`: no constructor switch lists them and Kinds() must not
  # be held equal to them.
  #
  # They are subjects because the loop behaves differently with durable state
  # than without, and because four paths reach processBatch. One cell per
  # configuration is what shows which of those combinations is proven.
  - id: pipeline.stateful
    kind: pipeline
    constructed: false
    implements: [Source, Sink, Handler]
    feature: state.durability
    exempt: []

  - id: pipeline.stateless
    kind: pipeline
    constructed: false
    implements: [Source, Sink, Handler]
    feature: core.consume_loop
    exempt:
      - invariant: pipeline.state.with_offsets
        reason: keeps no durable state, so there is nothing to commit with the offsets
        proven_by: TestPipelineStateless_KeepsNoDurableState

  # --- Handlers --------------------------------------------------------------
  - id: handler.structured
    kind: handler
    implements: [Handler]
    feature: handler.structured
    exempt: []

  - id: handler.inferred_mem
    kind: handler
    implements: [Handler, MetadataWriter]
    feature: handler.inferred_mem
    exempt: []

  - id: handler.inferred_disk
    kind: handler
    implements: [Handler]
    feature: handler.inferred_disk
    exempt: []
