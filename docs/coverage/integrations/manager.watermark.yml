# The watermark manager. A second loop that reaches a sink: collect the
# buckets the watermark has passed, flush them, delete them, advance the
# watermark. The delete and the watermark are its commit, so its invariants
# are the consume loop's restated for that commit, plus the liveness a poll
# loop owes on its own, plus what the watermark adds.
#
# `constructed: false` because no constructor switch lists managers:
# buildManagedTables builds the one kind there is. Kinds() must not be held
# equal to this entry.
id: manager.watermark
kind: manager
constructed: false
implements: [Manager]
feature: manager.window
exempt: []
