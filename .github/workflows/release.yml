name: Release

# Publishing runs here rather than from a workstation. v1.0.0 was published by
# hand from a mac with a plain `docker build`, which produces a single-arch
# image, and went out arm64-only -- it could not run on amd64 at all. When the
# build runs in CI the architecture is never a property of whoever typed the
# command.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-image:
    name: Publish image
    runs-on: ubuntu-latest
    env:
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          # make release-image derives VERSION from `git describe` and refuses
          # an untagged HEAD, so the tags and history have to be present.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      # The publish is gated on the tests: a tag pointing at broken code must
      # not reach Docker Hub, where `latest` would pick it up immediately.
      - name: Test
        run: go test ./internal/...

      # The foreign architecture builds under emulation. CGO_ENABLED=1 is
      # required for the ADBC driver manager, which rules out cross-compiling,
      # so the non-native leg is genuinely slow rather than merely awkward.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds linux/amd64 and linux/arm64 and pushes both under one manifest,
      # tagging latest alongside the version.
      - name: Build and push
        run: make release-image

      # Reads the registry back. A single-arch publish looks identical to a
      # good one locally, and so does a latest left pointing at an older
      # release; both are only visible from outside.
      - name: Verify published image
        run: make release-image-verify

      # The manifest listing an architecture does not mean that binary runs.
      # The build for the non-native arch happens under emulation and is never
      # executed during the build, so this is the first time it runs at all.
      - name: Verify each published architecture executes
        run: |
          set -e
          for platform in linux/amd64 linux/arm64; do
            echo "== $platform"
            out=$(docker run --rm --platform "$platform" "$SQLFLOW_IMAGE" version)
            echo "$out"
            echo "$out" | grep -q "^sqlflow ${GITHUB_REF_NAME}$" || {
              echo "expected 'sqlflow ${GITHUB_REF_NAME}' from $platform" >&2
              exit 1
            }
          done
        env:
          SQLFLOW_IMAGE: turbolytics/sql-flow:${{ github.ref_name }}
