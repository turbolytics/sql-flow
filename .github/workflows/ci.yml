name: CI
on: [push]
jobs:
  # The Go engine (sqlflow), unit pass only. Fast feedback with no Docker: the
  # integration tests start containers, and the Image job runs those.
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # Some tests open DuckDB through ADBC, which dlopens the library named
      # here rather than linking against it.
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      # go.mod requires a newer Go than the version set up below, so the
      # toolchain it asks for is fetched on demand.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # ./... rather than ./internal/...: the narrower form covers 16 of the 17
      # packages, and the 17th has no tests today. That makes the gap silent
      # rather than absent -- the first test added under cmd/ would not run.
      #
      # -short is the unit pass. The integration tests provision a broker and
      # take ~25s doing it, which is the wrong trade for the job whose whole
      # job is speed. The Image job runs them.
      - name: Test Unit
        run: go test -short ./...

  # The coverage matrix generator. It gates every merge, so a wrong generator
  # is a wrong gate. Pure Python: no Docker, no image, seconds to run.
  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Test the coverage matrix generator
        run: pytest tests/tooling -q

  # One job builds the image, runs every suite against it, and gates on the
  # result. It used to be two: a Coverage job and an Image job, each building
  # the same image and each running the same 16 release tests, ~175s of
  # duplicated work per push.
  #
  # The image tests a different failure class from the Go job -- a broken
  # entrypoint or a missing libduckdb passes every unit test -- and the matrix
  # needs their results, so they belong in one place.
  #
  # Single-arch and native, so it stays fast; the multi-arch build happens at
  # release time in release.yml.
  image:
    name: Image
    runs-on: ubuntu-latest
    env:
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION comes from `git describe`, which needs tags and history.
          fetch-depth: 0

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip PyYAML
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Builds the image, runs the unit, integration and release passes against
      # it, regenerates the matrix and gates on it. No broker step: the
      # integration tests start their own container, so a contributor runs the
      # same command locally without reading this file first.
      - name: Test the image and check the coverage matrix
        run: make coverage-matrix-check

      # The matrix is the diff a reviewer reads. When the check fails because
      # it is stale, the regenerated file is more useful than the log line.
      - name: Upload the regenerated matrix
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: docs/coverage/
