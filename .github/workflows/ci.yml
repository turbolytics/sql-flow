name: CI
on: [push]
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test Unit
        run: |
          mkdir /tmp/sqlflow
          mkdir /tmp/sqlflow/resultscache
          make test-unit

      - name: Test Integration
        run: |
          make test-integration

  # The Go engine (turbine). Unit tests only: anything that needs a Kafka broker
  # stays out of CI and runs from the dev stack.
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # Some tests open DuckDB through ADBC, which dlopens the library named
      # here rather than linking against it.
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      # go.mod requires a newer Go than the version set up below, so the
      # toolchain it asks for is fetched on demand.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test Unit
        run: go test ./internal/...
