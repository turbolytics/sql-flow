name: CI
on: [push]
jobs:
  # The Go engine (sqlflow), unit pass only. Fast feedback with no Docker: the
  # integration tests start containers, and the job below runs those.
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # Some tests open DuckDB through ADBC, which dlopens the library named
      # here rather than linking against it.
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      # local, not auto: the version set up below is the one that compiles.
      # Under auto, a go.mod directive newer than it silently downloads
      # another toolchain, and the line below stops describing the build.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # setup-go's own cache is keyed on go.sum alone, and on a hit it declines
      # to write a new one: "Cache hit occurred on the primary key, not saving
      # cache". So the compiled objects in it are frozen at whatever the first
      # run with that go.sum happened to produce, and this repo's own packages
      # recompiled from nothing on every push -- 91 seconds of the Test Unit
      # step before a single test ran. A dependency bump missed the key
      # outright and cost a fully cold run: Build 113s instead of 7s, the job
      # 342s instead of 208s. The cache below holds the same two directories
      # under a key that rolls forward.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The commit in the key makes every run a miss on the primary key,
          # so the save at the end always writes a fresh entry; the
          # restore-keys are what actually match, newest first. The last one
          # drops go.sum, which is what turns a dependency bump from a cold
          # build into a partial one -- only the modules that actually moved
          # recompile.
          #
          # "unit-race" is not decoration. This suite compiles with -race, and
          # race-instrumented objects are different cache entries from the
          # integration job's. One shared entry would have each job evicting
          # the other's work.
          key: go-unit-race-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-race-${{ hashFiles('**/go.sum') }}-
            go-unit-race-

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # ./... rather than ./internal/...: the narrower form covers 16 of the 17
      # packages, and the 17th has no tests today. That makes the gap silent
      # rather than absent -- the first test added under cmd/ would not run.
      #
      # -json so the coverage job can read this run instead of repeating it.
      # tee keeps the events in the log, where a failure is the line carrying
      # "Action":"fail" and its test name.
      #
      # -race because the conformance harness coordinates goroutines, and two
      # of its races reached main: a WaitGroup whose Add ran on the pipeline's
      # goroutine while Wait ran on the harness's, and a channel closed by one
      # goroutine while another was sending on it. The second panicked a CI run
      # outright, and neither reproduced by re-running. The detector found both
      # on the first pass.
      # -count=1 defeats the test result cache, not the build cache, so the
      # compile stays warm and every test still runs.
      #
      # It is needed because of the cache above. `go test` caches the result
      # of a package whose inputs have not changed, and a frozen build cache
      # had nothing to serve, so this suite always ran everything: 0 cached
      # packages in run 35480115049. With a working cache it served 11 of 26
      # packages from the last run -- 208 tests that did not execute,
      # including internal/serve (74) and internal/cli/run (48). Go is within
      # its contract there, and for a deterministic test it is the same
      # answer. These are not all deterministic: -race is a sampler, and the
      # timing tests in serve and websocket pass or fail on a schedule. A gate
      # that runs a third fewer tests depending on what a cache holds is not a
      # gate anyone can reason about.
      - name: Test Unit
        run: |
          mkdir -p .coverage
          set -o pipefail
          go test -short -race -count=1 -json ./... | tee .coverage/go.json

      # always(): a failing suite is exactly when the matrix needs this report,
      # so it can name the feature that broke rather than reporting nothing.
      - name: Upload the unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-unit
          path: .coverage/go.json

      # always(), because a failing suite compiled the same objects a passing
      # one would have, and the next run should not pay for them again.
      #
      # main only: a save is a few hundred megabytes into a 10 GB repository
      # budget, and if every branch wrote one they would evict each other and
      # the entry every branch reads. Pull requests restore from main and are
      # the faster for it.
      - name: Save the Go caches
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-unit-race-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # The Go tests that need a real service. They start their own containers, so
  # this job installs nothing beyond the toolchain.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    env:
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # setup-go's own cache is keyed on go.sum alone, and on a hit it declines
      # to write a new one: "Cache hit occurred on the primary key, not saving
      # cache". So the compiled objects in it are frozen at whatever the first
      # run with that go.sum happened to produce, and this repo's own packages
      # recompiled from nothing on every push -- 91 seconds of the Test Unit
      # step before a single test ran. A dependency bump missed the key
      # outright and cost a fully cold run: Build 113s instead of 7s, the job
      # 342s instead of 208s. The cache below holds the same two directories
      # under a key that rolls forward.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Its own namespace: this suite builds without -race, so none of its
          # objects are interchangeable with the unit job's.
          key: go-integration-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-integration-${{ hashFiles('**/go.sum') }}-
            go-integration-

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      # -count=1 for the same reason as the unit suite: the result cache
      # skipped internal/kafka's 8 integration tests and internal/serve's on
      # the first warm run. These talk to real containers, which is the one
      # place a cached pass says least about the next one.
      - name: Test Integration
        run: |
          mkdir -p .coverage
          set -o pipefail
          go test -count=1 -json -run '^TestIntegration' ./... | tee .coverage/go-integration.json

      - name: Upload the integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-integration
          path: .coverage/go-integration.json

      - name: Save the Go caches
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-integration-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # The coverage matrix generator. It gates every merge, so a wrong generator
  # is a wrong gate. Pure Python: no Docker, no image, seconds to run.
  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Test the coverage matrix generator
        run: uv run --locked pytest tests/tooling -q

  # Functional tests against the built image: entrypoint, CLI surface, the
  # baked-in libduckdb, and a real pipeline through Kafka. The Go job tests the
  # code; this tests the artifact users actually run, which is a different
  # failure class -- a broken entrypoint or a missing libduckdb passes every
  # unit test.
  #
  # Single-arch and native, so it stays fast; the multi-arch build happens at
  # release time in release.yml.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION comes from `git describe`, which needs tags and history.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.10'
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --locked

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile already mounts a Go build cache at /root/.cache/go-build
      # and a module cache at /go/pkg/mod, which is why a rebuild on a laptop
      # recompiles only what changed. On a runner both start empty every time,
      # so the `go build` layer took 105.8s of the build's 134s with nothing to
      # reuse, and not one of the 29 layers was cached.
      #
      # BuildKit does not export cache mounts as part of a layer cache -- only
      # layers -- so the two mounts are carried across runs by hand: restored
      # into directories here, injected into the mounts before the build, and
      # extracted back into the directories after it. That is all
      # buildkit-cache-dance does. It has to be actions/cache and not the
      # restore/save pair: post steps run in reverse, so this one's save lands
      # after the extract, which is the only order that saves anything.
      # Two steps, differing in one thing: whether a save happens at the end.
      # They have to be separate because injecting is destructive -- the
      # action deletes the local directory once its contents are inside the
      # mount, and only the extraction puts it back. So a run that skips
      # extraction and still saves writes an empty directory over a good
      # entry. That is not a hypothetical: it took a 464MB cache down to
      # 143MB in one run, and the run after it spent 218s building again.
      - name: Restore the image's Go caches
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: |
            image-go-build
            image-go-mod
          key: image-go-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('**/go.sum') }}-
            image-go-

      - name: Restore and refresh the image's Go caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: |
            image-go-build
            image-go-mod
          key: image-go-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-go-${{ hashFiles('**/go.sum') }}-
            image-go-

      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "image-go-build": "/root/.cache/go-build",
              "image-go-mod": "/go/pkg/mod"
            }
          # Injecting is cheap and extracting is not: 26s in, 90s back out,
          # against the 104s that caching `go build` saves. Paying both on
          # every run would be a wash. So only main copies the mounts back and
          # refreshes the entry; everywhere else injects what main last wrote
          # and keeps the saving. Same division as the Go jobs make -- one
          # branch writes, every branch reads -- and it is why the step above
          # is split in two.
          skip-extraction: ${{ github.ref != 'refs/heads/main' }}

      # Builds the image, then runs tests/release against it. The Kafka-backed
      # case brings its own broker up through testcontainers.
      - name: Test image
        env:
          # The layer cache covers everything ahead of `go build`: the apt
          # install, the module download, the libduckdb fetch. The `go build`
          # layer itself misses on every push, by design -- its input is the
          # source -- which is what the cache mounts above are for.
          DOCKER_BUILD_EXTRA: >-
            --cache-from type=gha,scope=image
            --cache-to type=gha,mode=max,scope=image
        run: make test-release

      - name: Upload the release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-release
          path: .coverage/pytest.json

  # The merge gate on feature coverage, and the last job to run.
  #
  # It runs no tests. Every suite above already ran and uploaded its report,
  # and this reads them -- so coverage costs seconds, not a second build and a
  # second release run. That was the earlier shape and it duplicated ~175s of
  # work per push.
  #
  # always(): a failing suite is when the matrix is most worth reading, because
  # it names the feature that broke. The gate still fails -- on the failure
  # itself, through the report -- but it fails saying which feature lost
  # coverage rather than saying nothing at all.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [go, integration, image]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Download every suite report
        uses: actions/download-artifact@v4
        with:
          path: .coverage
          pattern: report-*
          merge-multiple: true

      - name: Check the coverage matrix
        run: make coverage-check

      # The report carries every test name and count, which left the committed
      # page so that a PR adding a test changes nothing under docs/coverage.
      # Published on every run, not only on failure, or the names live nowhere.
      - name: Publish the coverage report
        if: always()
        run: |
          if [ -f .coverage/report.md ]; then
            cat .coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage/matrix.json
            .coverage/report.md
            docs/coverage/status/
            docs/coverage/matrix.md
