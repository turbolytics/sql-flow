name: CI
on: [push]
jobs:
  # The Go engine (sqlflow). Unit tests only: anything that needs a Kafka broker
  # stays out of CI and runs from the dev stack.
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      # Some tests open DuckDB through ADBC, which dlopens the library named
      # here rather than linking against it.
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      # go.mod requires a newer Go than the version set up below, so the
      # toolchain it asks for is fetched on demand.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l internal/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # ./... rather than ./internal/...: the narrower form covers 16 of the 17
      # packages, and the 17th has no tests today. That makes the gap silent
      # rather than absent -- the first test added under cmd/ would not run.
      #
      # -short is the unit pass. This job has no broker on purpose: it is the
      # fast feedback, and the integration tests fail rather than skip without
      # their service. The Coverage job runs those against a real one.
      - name: Test Unit
        run: go test -short ./...

  # The coverage matrix generator. It gates every merge, so a wrong generator
  # is a wrong gate. Pure Python: no Docker, no image, seconds to run.
  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Test the coverage matrix generator
        run: pytest tests/tooling -q

  # The merge gate on feature coverage. It regenerates docs/coverage/matrix.json
  # from both suites and fails on either half of the contract: a checked-in
  # matrix that no longer matches what the suites report, or a feature missing a
  # level features.yml says it requires.
  #
  # It runs both suites, so it needs both toolchains and the image. That is the
  # cost of a gate that cannot be satisfied by a skip -- a skipped test reports
  # as SKIP, and SKIP is not coverage.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      SQLFLOW_DUCKDB_LIB: ${{ github.workspace }}/bin/libduckdb.so
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION comes from `git describe`, which needs tags and history.
          fetch-depth: 0

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libduckdb
        run: ./scripts/install-libduckdb.sh bin

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip PyYAML
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # The integration pass fails without a broker, deliberately: a test that
      # excuses itself when its service is absent reports "ok" and covers
      # nothing. Only zoo1 and kafka1 -- the rest of the dev stack is postgres,
      # minio and clickhouse, which nothing in this pass touches.
      - name: Start Kafka
        run: |
          docker compose -f dev/kafka-single.yml up -d zoo1 kafka1
          for _ in $(seq 1 60); do
            if nc -z localhost 9092; then echo "broker up"; exit 0; fi
            sleep 2
          done
          echo "kafka never came up" >&2
          docker compose -f dev/kafka-single.yml logs kafka1 >&2
          exit 1

      - name: Check the coverage matrix
        run: make coverage-matrix-check

      # The matrix is the diff a reviewer reads. When the check fails because it
      # is stale, the regenerated file is more useful than the log line.
      - name: Upload the regenerated matrix
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: docs/coverage/

  # Functional tests against the built image: entrypoint, CLI surface, the
  # baked-in libduckdb, and a real pipeline through Kafka. The Go job above
  # tests the code; this tests the artifact users actually run, which is a
  # different failure class -- a broken entrypoint or a missing libduckdb
  # passes every unit test.
  #
  # Single-arch and native, so it stays fast; the multi-arch build happens at
  # release time in release.yml.
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VERSION comes from `git describe`, which needs tags and history.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.dev.txt ]; then pip install -r requirements.dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Builds the image, then runs tests/release against it. The Kafka-backed
      # case brings its own broker up through testcontainers.
      - name: Test image
        run: make test-release
