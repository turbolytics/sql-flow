id: sink.postgres
kind: sink
implements: [Sink, Prober, KeyedSink, TypeTable]
feature: sink.postgres
exempt: []
answers:
  sink.types:
    bool:
      outcome: exact
      columns:
        - type: boolean
          expect: "true"
      supported: true
    int8:
      outcome: exact
      columns:
        - type: smallint
          expect: "-128"
      supported: true
    int16:
      outcome: exact
      columns:
        - type: smallint
          expect: "-32768"
      supported: true
    int32:
      outcome: exact
      columns:
        - type: integer
          expect: "-2147483648"
      supported: true
    int64:
      outcome: exact
      columns:
        - type: bigint
          expect: "-9223372036854775808"
      supported: true
    # Postgres has no unsigned integers. Each is sent as the next signed
    # width, and uint64 above the bigint range as numeric.
    uint8:
      outcome: coerced
      rule: sent as smallint
      columns:
        - type: smallint
          expect: "255"
      supported: true
    uint16:
      outcome: coerced
      rule: sent as integer
      columns:
        - type: integer
          expect: "65535"
      supported: true
    uint32:
      outcome: coerced
      rule: sent as bigint
      columns:
        - type: bigint
          expect: "4294967295"
      supported: true
    uint64:
      outcome: coerced
      rule: sent as bigint when it fits, otherwise as numeric
      columns:
        - type: numeric
          expect: "18446744073709551615"
      supported: true
    float32:
      outcome: exact
      columns:
        - type: real
          expect: "3.4028235e+38"
      supported: true
    float64:
      outcome: exact
      columns:
        - type: double precision
          expect: "1.7976931348623157e+308"
      supported: true
    "decimal(*, *)":
      outcome: exact
      columns:
        - type: numeric
          expect: "170141183460469231"
      supported: true
    utf8:
      outcome: exact
      columns:
        - type: text
          expect: "L'Œil \U0001F441 \"quoted\" back\\slash\ttab"
        - type: varchar(100)
          expect: "L'Œil \U0001F441 \"quoted\" back\\slash\ttab"
        # The destinations that parse the text. jsonb normalises spacing.
        - type: jsonb
          value: '{"a":1}'
          expect: '{"a": 1}'
        - type: uuid
          value: "0b7e2c9a-4d31-4f6e-9a02-7c1de3f10b45"
          expect: "0b7e2c9a-4d31-4f6e-9a02-7c1de3f10b45"
        - type: numeric
          value: "1234.56"
          expect: "1234.56"
        # #153's shape: a timestamp the handler passed through without a CAST,
        # so it arrives as text and lands in a temporal column. Postgres parses
        # a zone-less string in the session's TimeZone, which is the server's,
        # never the sqlflow host's; `instant` runs this with the host clock
        # nine hours ahead to prove it.
        - type: timestamp
          value: "2026-09-01 12:00:00"
          expect: "2026-09-01 12:00:00"
          instant: true
        - type: timestamptz
          value: "2026-09-01 12:00:00+00"
          expect: "2026-09-01 12:00:00+00"
          instant: true
      supported: true
    binary:
      outcome: exact
      columns:
        - type: bytea
          expect: "\\x00ff7f80"
      supported: true
    date32:
      outcome: exact
      columns:
        - type: date
          expect: "2026-09-08"
      supported: true
    "timestamp[s]":
      outcome: exact
      columns:
        - type: timestamp
          expect: "2026-09-08 12:00:00"
      supported: true
    "timestamp[ms]":
      outcome: exact
      columns:
        - type: timestamp
          expect: "2026-09-08 12:00:00.123"
      supported: true
    "timestamp[us]":
      outcome: exact
      columns:
        - type: timestamp
          expect: "2026-09-08 12:00:00.123456"
        # A naive timestamp into timestamptz is read as a UTC instant.
        - type: timestamptz
          expect: "2026-09-08 12:00:00.123456+00"
      supported: true
    "timestamp[ns]":
      outcome: coerced
      rule: Postgres keeps microseconds; the nanoseconds are truncated
      columns:
        - type: timestamp
          expect: "2026-09-08 12:00:00.123456"
      supported: true
    "timestamp[us, tz=*]":
      outcome: exact
      columns:
        - type: timestamptz
          expect: "2026-09-08 12:00:00.123456+00"
        # The instant's UTC wall clock, into a column with no zone.
        - type: timestamp
          expect: "2026-09-08 12:00:00.123456"
      supported: true
    # DuckDB's TIME and INTERVAL. Postgres keeps microseconds.
    month_day_nano_interval:
      outcome: coerced
      rule: months and days kept; nanoseconds below a microsecond are truncated
      columns:
        - type: interval
          expect: "1 mon 2 days"
      supported: true
    "time64[us]":
      outcome: exact
      columns:
        - type: time
          expect: "12:00:00.123456"
      supported: true
    "time64[ns]":
      outcome: coerced
      rule: nanoseconds below a microsecond are truncated
      columns:
        - type: time
          expect: "00:00:43.200123"
      supported: true
    # Containers go as JSON text rendered from the Arrow array, into a json
    # column, which stores the text as sent. Element renderings follow
    # arrow-go's own MarshalJSON: a date as YYYY-MM-DD, a timestamp as
    # RFC 3339 in the type's zone (Z for none), binary as base64. Measured,
    # not assumed: the first draft of these rows used a space and no zone.
    "list<bool>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[true,true,true]"
      supported: true
    "list<int8>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[-128,-128,-128]"
      supported: true
    "list<int16>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[-32768,-32768,-32768]"
      supported: true
    "list<int32>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[-2147483648,-2147483648,-2147483648]"
      supported: true
    "list<int64>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[-9223372036854775808,-9223372036854775808,-9223372036854775808]"
      supported: true
    "list<uint8>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[255,255,255]"
      supported: true
    "list<uint16>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[65535,65535,65535]"
      supported: true
    "list<uint32>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[4294967295,4294967295,4294967295]"
      supported: true
    "list<uint64>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[18446744073709551615,18446744073709551615,18446744073709551615]"
      supported: true
    "list<float32>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[3.4028235e+38,3.4028235e+38,3.4028235e+38]"
      supported: true
    "list<float64>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[1.7976931348623157e+308,1.7976931348623157e+308,1.7976931348623157e+308]"
      supported: true
    "list<utf8>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[\"L'Œil \U0001F441 \\\"quoted\\\" back\\\\slash\\ttab\",\"L'Œil \U0001F441 \\\"quoted\\\" back\\\\slash\\ttab\",\"L'Œil \U0001F441 \\\"quoted\\\" back\\\\slash\\ttab\"]"
      supported: true
    "list<binary>":
      outcome: coerced
      rule: rendered as JSON text, each element base64
      columns:
        - type: json
          expect: '["AP9/gA==","AP9/gA==","AP9/gA=="]'
      supported: true
    "list<date32>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: '["2026-09-08","2026-09-08","2026-09-08"]'
      supported: true
    "list<timestamp[s]>":
      outcome: coerced
      rule: rendered as JSON text, each element RFC 3339 in UTC
      columns:
        - type: json
          expect: '["2026-09-08T12:00:00Z","2026-09-08T12:00:00Z","2026-09-08T12:00:00Z"]'
      supported: true
    "list<timestamp[ms]>":
      outcome: coerced
      rule: rendered as JSON text, each element RFC 3339 in UTC
      columns:
        - type: json
          expect: '["2026-09-08T12:00:00.123Z","2026-09-08T12:00:00.123Z","2026-09-08T12:00:00.123Z"]'
      supported: true
    "list<timestamp[us]>":
      outcome: coerced
      rule: rendered as JSON text, each element RFC 3339 in UTC
      columns:
        - type: json
          expect: '["2026-09-08T12:00:00.123456Z","2026-09-08T12:00:00.123456Z","2026-09-08T12:00:00.123456Z"]'
      supported: true
    "list<timestamp[ns]>":
      outcome: coerced
      rule: rendered as JSON text, each element RFC 3339 in UTC
      columns:
        - type: json
          expect: '["2026-09-08T12:00:00.123456789Z","2026-09-08T12:00:00.123456789Z","2026-09-08T12:00:00.123456789Z"]'
      supported: true
    "list<timestamp[us, tz=*]>":
      outcome: coerced
      rule: rendered as JSON text, each element RFC 3339 in the type's own zone
      columns:
        - type: json
          expect: '["2026-09-08T21:00:00.123456+09:00","2026-09-08T21:00:00.123456+09:00","2026-09-08T21:00:00.123456+09:00"]'
      supported: true
    "list<list<int64>>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[[-9223372036854775808,-9223372036854775808,-9223372036854775808],[-9223372036854775808,-9223372036854775808,-9223372036854775808],[-9223372036854775808,-9223372036854775808,-9223372036854775808]]"
      supported: true
    "list<struct>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: '[{"a":7},{"a":7},{"a":7}]'
      supported: true
    "fixed_size_list<int32>[3]":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: "[1,2,3]"
      supported: true
    struct:
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: '{"a":7}'
      supported: true
    map:
      outcome: coerced
      rule: rendered as JSON text, an array of key and value pairs
      columns:
        - type: json
          expect: '[{"key":"k","value":9}]'
      supported: true
    # A container does not launder an element the sink cannot convert.
    "list<decimal(*, *)>":
      outcome: unsupported
      code: user.sink.type_unsupported
      columns: []
      unsupported: true
      reason: fails loudly with user.sink.type_unsupported
      proven_by: "TestIntegrationSinkPostgres_Types/member/list<decimal(*,_*)>"
    "list<time64[us]>":
      outcome: coerced
      rule: rendered as JSON text
      columns:
        - type: json
          expect: '["12:00:00.123456","12:00:00.123456","12:00:00.123456"]'
      supported: true
    sparse_union:
      outcome: unsupported
      code: user.sink.type_unsupported
      columns: []
      unsupported: true
      reason: fails loudly with user.sink.type_unsupported
      proven_by: "TestIntegrationSinkPostgres_Types/member/sparse_union"
    # DuckDB's ENUM. The column holds the decoded value.
    dictionary:
      outcome: exact
      columns:
        - type: text
          expect: "a"
      supported: true
  sink.nulls:
    default:
      outcome: exact
      rule: stored as NULL; a NOT NULL column refuses it at the merge
      supported: true
    list_element:
      outcome: exact
      rule: a JSON null inside the rendered array
      supported: true
